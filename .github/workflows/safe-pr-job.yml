name: Safe PR job

on:
  pull_request_target:

jobs:
  safe_print_pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Print PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" >> /tmp/pull_requests_history.txt
    env:
      SUPER_SECRET: ${{ secrets.SUPER_SECRET }}
